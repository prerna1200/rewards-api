spring.application.name=rewards-api
# H2 datasource (in-memory)
spring.datasource.url=jdbc:h2:mem:rewardsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Expose H2 web console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Use SQL scripts in classpath to initialize schema and data
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Because we provide schema.sql, disable Hibernate auto DDL
spring.jpa.hibernate.ddl-auto=none

# Optional: show SQL in logs
spring.jpa.show-sql=true