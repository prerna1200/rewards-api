spring.application.name=rewards-api

# ✅ H2 in-memory database
spring.datasource.url=jdbc:h2:mem:rewardsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ✅ H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ✅ SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ✅ Disable Hibernate auto creation (because using schema.sql)
spring.jpa.hibernate.ddl-auto=none

# ✅ Show SQL (optional but useful)
spring.jpa.show-sql=true

# ✅ Format SQL nicely (optional)
spring.jpa.properties.hibernate.format_sql=true